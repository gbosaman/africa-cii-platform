<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Africa CII">
  <!--
    Favicon: the same mark as the sidebar logo — a rounded gradient tile
    carrying an angular "A". Kept deliberately bold and high-contrast because
    this is read at 16px more often than at 64px; fine detail just turns to mud.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <path d="M32 12 L52 52 H42.5 L32 30.5 L21.5 52 H12 Z" fill="#05140b"/>
</svg>
